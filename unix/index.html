<style>
  :root {
    --bg: #07090d;
    --board: #0d1117;
    --cell: #161b22;
    --cell-edge: #05070a;
    --line: #232a35;
    --text: #f5f1e6;
    --dim: #7d8794;

    --green: #4ade80;
    --red: #ff5a5a;
    --blue: #6cb6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 1600px; margin: 0 auto; }

  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 12px; border-bottom: 2px solid var(--amber); padding-bottom: 14px; margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 8px; background: #c62828;
    display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #fff;
  }
  h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: .08em; }
  h1 small { color: var(--amber); font-size: .5em; letter-spacing: .2em; vertical-align: middle; margin-left: 6px; }
  .sub { color: var(--dim); font-size: 12px; letter-spacing: .12em; margin-top: 4px; }
  .clock { text-align: right; }
  .clock .time { font-size: clamp(26px, 4vw, 40px); font-weight: 700; color: var(--amber); letter-spacing: .06em; }
  .clock .meta { color: var(--dim); font-size: 12px; letter-spacing: .1em; }
  .stale { color: var(--red); }

  /* company stats */
  .stats { display: grid; gap: 14px; margin-bottom: 28px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { display: flex; flex-direction: column; }
  .kpi .lbl { white-space: normal; line-height: 1.4; }
  .kpi .val { margin-top: auto; padding-top: 6px; white-space: nowrap; }
  .kpi, .reg, .panel { background: var(--board); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .lbl { color: var(--dim); font-size: 10px; letter-spacing: .15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .val { font-size: clamp(22px, 2.4vw, 30px); font-weight: 700; margin-top: 6px; color: var(--text); font-variant-numeric: tabular-nums; }
  .kpi .val small { color: var(--dim); font-size: .5em; font-weight: 400; margin-left: 4px; }
  .kpi .val.amber { color: var(--amber); }

  .regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  @media (min-width: 1280px) { .regions { grid-template-columns: repeat(9, 1fr); } }
  .reg .top { display: flex; align-items: baseline; gap: 8px; }
  .reg .rank { margin-left: auto; font-size: 24px; font-weight: 700; color: var(--amber); }
  .reg .rank small { color: var(--dim); font-size: 11px; font-weight: 400; }
  .reg.first .rank { color: var(--green); }
  .reg.out .rank { color: var(--dim); font-size: 16px; }
  .reg .v { font-size: 15px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .reg .note { color: var(--dim); font-size: 10px; line-height: 1.4; margin-top: 4px; min-height: 2.8em; overflow-wrap: anywhere;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .reg.first .note { color: var(--green); }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .panel ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; }
  .panel li { display: grid; grid-template-columns: 7.5em 1fr auto; align-items: center; gap: 10px; font-size: 12px; }
  .panel li > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
  .panel li .bar { height: 6px; border-radius: 0 3px 3px 0; background: var(--amber); opacity: .75; }
  .panel li b { font-weight: 400; color: #aab3bf; font-variant-numeric: tabular-nums; }
  .panel.wide li { grid-template-columns: 12em 1fr auto; }
  .panel li.us > span:first-child, .panel li.us b { color: var(--amber); font-weight: 700; }
  .panel li.gap { grid-template-columns: 1fr; color: var(--dim); font-size: 10px; line-height: 1; }
  .panel .foot { color: var(--dim); font-size: 10px; letter-spacing: .1em; margin-top: 8px; }
  .section-h { color: var(--amber); font-size: 11px; letter-spacing: .25em; margin: 6px 0 -4px; }

  .boards { display: grid; grid-template-columns: 1fr; gap: 28px; }
  @media (min-width: 1440px) { .boards { grid-template-columns: 1fr 1fr; } }

  .board { background: var(--board); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .board h2 {
    margin: 0; padding: 14px 18px; display: flex; align-items: center; gap: 12px;

  .board h2 .es { color: var(--dim); font-size: 12px; letter-spacing: .2em; font-weight: 400; margin-left: auto; }

  th {

    padding: 10px 8px; border-bottom: 1px solid var(--line);
  }
  td { padding: 6px 8px; border-bottom: 1px solid #121821; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tr:last-child td { border-bottom: 0; }
  th:first-child, td:first-child { padding-left: 16px; }
  th:last-child, td:last-child { padding-right: 16px; }
  col.c-time { width: 112px; } col.c-flight { width: 144px; } col.c-ac { width: 120px; } col.c-status { width: 150px; }

  .flap { display: inline-flex; gap: 2px; font-size: 14px; }
  .flap span {
    position: relative; display: inline-block; width: 14px; text-align: center;
    padding: 3px 1px; border-radius: 3px; font-weight: 700;
    background: linear-gradient(var(--cell) 0 49%, var(--cell-edge) 49% 51%, var(--cell) 51%);

  }
  @keyframes flip { from { transform: rotateX(90deg); opacity: .2; } to { transform: rotateX(0); opacity: 1; } }

  .city { font-size: 13px; color: var(--text); display: block; overflow: hidden; text-overflow: ellipsis; }
  .code { color: var(--amber); font-weight: 700; margin-right: 6px; }
  .ac { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .ac b { display: block; color: #aab3bf; font-weight: 400; font-size: 11px; }

  .st { font-weight: 700; font-size: 13px; letter-spacing: .08em; }
  .st small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; letter-spacing: .05em; }
  .st.air { color: var(--blue); }
  .st.ok { color: var(--green); }
  .st.appr { color: var(--amber); animation: blink 1.2s steps(2, start) infinite; }
  .st.late { color: var(--red); }
  @keyframes blink { to { opacity: .35; } }

  .empty { color: var(--dim); text-align: center; padding: 28px; letter-spacing: .15em; }
  tr.done td { opacity: .6; }

  footer { margin-top: 24px; color: var(--dim); font-size: 11px; letter-spacing: .1em; text-align: center; }
  footer a { color: var(--dim); }

  @media (max-width: 640px) {
    col.c-ac, th.ac-h, td.ac-d { display: none; }
    col.c-time { width: 76px; } col.c-flight { width: 100px; } col.c-status { width: 104px; }
    th:first-child, td:first-child { padding-left: 10px; }
    th:last-child, td:last-child { padding-right: 10px; }
    td, th { padding-left: 4px; padding-right: 4px; }
    .flap { font-size: 11px; gap: 1px; }
    .flap span { width: 11px; }
    .city .name { display: none; }
    .st { font-size: 11px; }
    .board h2 { font-size: 16px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .regions { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .flap span, .st.appr { animation: none; } }
</style>

    <td>${flap(f.cs, d + 120)}</td>
    <td>${where}</td>
    <td class="ac-d">${plane(f)}</td>
    <td>${status}</td></tr>`;
}

function render(animate) {
  const now = Date.now();
  const air = DATA.flights.filter(f => f.status === "air");
  const landed = DATA.flights.filter(f => f.status === "landed");

  const deps = [...DATA.flights].sort((a, b) => b.dep - a.dep);
  const arrs = [...air.sort((a, b) => a.arr - b.arr), ...landed.sort((a, b) => b.landed - a.landed)];
  const empty = msg => `<tr><td colspan="5" class="empty">${msg}</td></tr>`;

  const dep = document.getElementById("dep"), arr = document.getElementById("arr");
  dep.innerHTML = deps.length ? deps.map((f, i) => row(f, i, f.dep, place(f.to), depStatus(f, now), f.status === "landed")).join("") : empty("NO FLIGHTS · SIN VUELOS");
  arr.innerHTML = arrs.length ? arrs.map((f, i) => row(f, i, f.status === "landed" ? f.landed : f.arr, place(f.from), arrStatus(f, now), f.status === "landed")).join("") : empty("NO FLIGHTS · SIN VUELOS");
  if (!animate) document.querySelectorAll(".flap span").forEach(s => s.style.animation = "none");
}

const COUNTRY = { AR: "ARGENTINA", UY: "URUGUAY", BR: "BRASIL", CL: "CHILE", PY: "PARAGUAY",
                  BO: "BOLIVIA", PE: "PERÚ", MX: "MÉXICO", US: "EE.UU." };
const num = n => n.toLocaleString("es-AR");
const short = n => n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e4 ? `${Math.round(n / 1e3)}K` : num(n);
const day = t => new Date(t).toLocaleDateString("es-AR", { timeZone: TZ, day: "2-digit", month: "2-digit" });

function kpi(label, val, cls = "") {
  return `<div class="kpi"><div class="lbl">${label}</div><div class="val ${cls}">${val}</div></div>`;
}

function region(r) {
  const name = esc(COUNTRY[r.region] || r.region);
  let cls = "", rank, note;
  if (r.rank === 1) {
    cls = "first"; rank = "#1"; note = "LEADER · LÍDER";
  } else if (r.rank) {
    rank = `#${r.rank}<small>/${r.n}</small>`;
    note = `${short(r.ahead.v - r.v)} DETRÁS DE ${esc(r.ahead.name)}`;
  } else if (r.cutoff) {
    cls = "out"; rank = `&gt;${r.n}`;
    note = `OUT OF TOP ${r.n} · FUERA (CORTE ${short(r.cutoff)})`;
  } else {
    cls = "out"; rank = "—";
    note = r.leader ? `NONE THIS WEEK · LÍDER ${esc(r.leader.name)}` : "NONE THIS WEEK · SIN ENTREGAS";
  }
  const title = r.leader ? `${name}: ${r.v ? num(r.v) : "sin datos"} · líder ${r.leader.name} ${num(r.leader.v)}` : name;
  return `<div class="reg ${cls}" title="${esc(title)}">
    <div class="top"><span class="code">${esc(r.region)}</span><span class="lbl">${name}</span><span class="rank">${rank}</span></div>
    <div class="v">${r.v ? num(r.v) : r.cutoff ? `&lt;${num(r.cutoff)}` : "—"}</div>
    <div class="note">${note}</div></div>`;
}

function list(label, rows) {
  if (!rows.length) return "";
  const max = rows[0][1];
  return `<div class="panel"><div class="lbl">${label}</div><ol>${rows.map(([k, v]) =>
    `<li><span>${esc(k)}</span><span class="bar" style="width:${Math.max(4, v / max * 100)}%"></span><b>${num(v)}</b></li>`).join("")}</ol></div>`;
}

function companies(w, weeks) {
  const max = w.top.length ? w.top[0].v : 1;
  const li = (rank, name, v, us) => `<li class="${us ? "us" : ""}"><span>${rank}. ${esc(name)}</span>` +
    `<span class="bar" style="width:${Math.max(4, v / max * 100)}%"></span><b>${num(v)}</b></li>`;
  let rows = w.top.map((c, i) => li(i + 1, c.name, c.v, c.us)).join("");
  if (!w.top.some(c => c.us)) {
    rows += `<li class="gap">⋮</li>`;
    rows += w.rank ? li(w.rank, "Unix Airways", w.v, true)
                   : `<li class="us"><span>&gt;${w.n}. Unix Airways</span><span></span><b>≈${num(w.v)}</b></li>`;
  }
  let foot = w.rank > 1 ? `${short(w.ahead.v - w.v)} DETRÁS DE ${esc(w.ahead.name)}`
           : w.rank === 1 ? "LEADER · LÍDER MUNDIAL"
           : w.cutoff ? `${short(w.cutoff - w.v)} TO TOP ${w.n} · FALTAN PARA ENTRAR` : "";
  const last = weeks && weeks[weeks.length - 1];
  if (last) foot += `${foot ? " · " : ""}SEMANA PASADA ${last.rank ? "#" + last.rank : "&gt;" + w.n}`;
  return `<div class="panel wide"><div class="lbl">COMPANY TABLE · TABLA MUNDIAL (SEMANA, $)</div><ol>${rows}</ol>` +
    (foot ? `<div class="foot">${foot}</div>` : "") + `</div>`;
}

function renderStats() {
  const s = DATA.stats, t = DATA.totals;
  if (!s && !t) return;
  const kpis = [];
  if (s && s.world) {
    const w = s.world;
    kpis.push(kpi("WORLD RANK · PUESTO MUNDIAL", w.rank ? `#${w.rank}<small>${short(w.v)}</small>` : `&gt;${w.n}<small>≈${short(w.v)}</small>`, "amber"));
  }
  if (s) {
    kpis.push(kpi("IN FLIGHT · EN VUELO", `${s.live}${s.flying ? `<small>/ ${num(s.flying)}</small>` : ""}`, "amber"));
    if (s.held) {
      kpis.push(kpi("AIRPORTS · AEROPUERTOS", num(s.held.n)));
      kpis.push(kpi("AIRPORTS $ · $ AEROPUERTOS", short(s.held.v)));
    }
  }
  if (t) {
    kpis.push(kpi("FLIGHTS · VUELOS", `${num(t.flights)}<small>desde ${day(t.since)}</small>`));
    kpis.push(kpi("PILOTS · PILOTOS", num(t.pilots)));
    kpis.push(kpi("HOURS · HORAS VOLADAS", num(Math.round(t.minutes / 60))));
  }
  if (s && s.bases && s.bases.length) kpis.push(kpi("BASE", esc(s.bases.join(" ")), "amber"));
  document.getElementById("kpis").innerHTML = kpis.join("");
  document.getElementById("regions").innerHTML = s && s.regions ? s.regions.map(region).join("") : "";

  const top = (o, n = 5) => Object.entries(o || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
  document.getElementById("panels").innerHTML = [
    s && s.world && companies(s.world, DATA.weeks),
    t && list("FLEET · FLOTA (VUELOS POR AVIÓN)", top(t.types)),
    t && list("TOP DESTINATIONS · DESTINOS (ATERRIZAJES)", top(t.airports)),
    s && s.held && list("TOP AIRPORTS · AEROPUERTOS (VALOR)", s.held.top.map(a => [a.code, a.v])),
  ].filter(Boolean).join("");
  document.getElementById("stats").hidden = false;
}

function tick() {
  const now = Date.now();
  document.getElementById("clock").textContent =
    new Date(now).toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const age = now - DATA.updated;
  const el = document.getElementById("updated");
  el.textContent = `UPDATED ${hhmm(DATA.updated)} ART · ${dur(age)} AGO`;
  el.className = "meta" + (age > 60 * 60 * 1000 ? " stale" : "");
}

renderStats();
render(true);
tick();
setInterval(tick, 1000);
setInterval(() => render(false), 30000);
</script>
</body>
</html>
